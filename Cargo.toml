[workspace]
members  = ["crates/herdr-client", "crates/herdr-gpui", "crates/herdr-protocol"]
resolver = "2"

[workspace.package]
edition      = "2024"
license      = "Apache-2.0"
rust-version = "1.96"
# Cargo metadata only. Releases carry a derived calendar version YYYYMMDD.COUNTER
# that CI embeds as HERDR_RELEASE_VERSION; this value never reaches the UI.
version = "0.1.0"
# Workspace crates are not published to crates.io; they build this application.
publish = false

[workspace.lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
url = "2"
anyhow               = "1"
aes                  = "0.8.4"
cbc                  = { features = ["block-padding"], version = "0.1.2" }
pbkdf2               = { default-features = false, features = ["hmac"], version = "0.12.2" }
bincode              = { default-features = false, features = ["serde", "std"], version = "2" }
chrono               = { default-features = false, features = ["clock"], version = "0.4" }
cocoa                = "0.27"
config_loader        = { default-features = false, features = ["toml"], package = "config", version = "0.15.25" }
core-graphics        = "0.25"
crossbeam-channel    = "0.5"
ed25519-dalek        = { default-features = false, features = ["std"], version = "2.2" }
flate2               = "1"
foreign-types        = "0.5"
gpui                 = { package = "gpui-pre", version = "=0.3.6" }
gpui_platform        = { package = "gpui-pre-platform", version = "=0.3.6" }
herdr-client         = { path = "crates/herdr-client" }
herdr-protocol       = { path = "crates/herdr-protocol" }
interprocess         = "2.4.2"
image                = { default-features = false, features = ["gif", "jpeg", "png", "webp"], version = "0.25.10" }
libloading           = "0.8.9"
nix                  = { default-features = false, features = ["socket", "user"], version = "=0.31.3" }
objc                 = "0.2"
objc2                = "0.6.4"
objc2-app-kit        = { default-features = false, features = ["NSApplication", "NSDockTile", "NSImage", "NSImageRep", "NSPasteboard", "std"], version = "0.3.2" }
objc2-foundation     = { default-features = false, features = ["NSBundle", "NSData", "NSProcessInfo", "NSString", "std"], version = "0.3.2" }
raw-window-handle    = "0.6"
rusqlite             = { features = ["bundled"], version = "0.37" }
rodio                = { default-features = false, features = ["playback", "symphonia-mp3", "tracing"], version = "0.22.2" }
rustix               = { features = ["event", "fs", "process"], version = "=1.1.5" }
secrecy              = { features = ["serde"], version = "=0.10.3" }
security-framework   = "=3.7.0"
serde                = { features = ["derive"], version = "1" }
serde_json           = "1"
sha1                 = "0.10.6"
sha2                 = "0.10.9"
tar                  = "0.4"
tempfile             = "3"
thiserror            = "2"
toml                 = "1.1"
toml_edit            = "0.25"
tracing              = "0.1"
tracing-subscriber   = { default-features = false, features = ["registry", "std"], version = "0.3" }
unicode-segmentation = "1"
unicode-width        = "0.2.2"
ureq                 = "3"
uuid                 = { features = ["serde"], version = "1" }
windows-sys          = { features = ["Win32_Foundation", "Win32_System_Pipes"], version = "0.61.2" }
zeroize              = "=1.9.0"
