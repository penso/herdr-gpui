name: Release
run-name: Release ${{ inputs.channel }} @ ${{ inputs.expected_sha }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA of main HEAD
        required: true
        type: string
      request_id:
        description: Optional unique dispatch correlation ID (set by just release)
        required: false
        default: ''
        type: string
      channel:
        description: stable publishes to everyone and Homebrew; beta publishes a prerelease to promote later
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions: {}

# Serialize publication and tap updates across versions; never cancel a signer.
concurrency:
  group: manual-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Release Workflow Security
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'penso/herdr-gpui' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          online-audits: false

  validate:
    needs: audit
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'penso/herdr-gpui' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
      channel: ${{ steps.validate.outputs.channel }}
      windows_signed: ${{ steps.windows-signing.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[a-zA-Z0-9-]{0,64}$ ]]
          [[ "$CHANNEL" == stable || "$CHANNEL" == beta ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(gh api repos/penso/herdr-gpui/git/ref/heads/main --jq .object.sha)" == "$EXPECTED_SHA" ]]
          # The calendar version is derived here, never dispatched: today's UTC
          # date and the next same-day counter after the tags GitHub already has.
          version=$(gh api --paginate repos/penso/herdr-gpui/git/matching-refs/tags/v --jq '.[].ref' |
            python3 scripts/release/next-version.py "$(date -u +%Y%m%d)")
          [[ "$version" =~ ^[1-9][0-9]{7}\.[1-9][0-9]*$ ]]
          printf 'version=%s\nsha=%s\nchannel=%s\n' "$version" "$EXPECTED_SHA" "$CHANNEL" >> "$GITHUB_OUTPUT"
          printf 'Publishing %s v%s\n' "$CHANNEL" "$version"
      - name: Validate embedded updater public key
        env:
          HERDR_UPDATE_PUBLIC_KEY: ${{ vars.HERDR_UPDATE_PUBLIC_KEY }}
        run: python3 scripts/update-manifest.py validate-public-key
      # Windows signing is on once its publisher, the WINDOWS_SIGNING_SUBJECT
      # repository variable, is set; windows-sign then requires the Azure
      # variables too. Until then Windows ships unsigned and skips winget, and
      # those builds name no publisher, so their in-app updater stays off
      # (herdr-updater/src/windows.rs) rather than trusting an unsigned installer.
      - id: windows-signing
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          if [[ -n "$WINDOWS_SIGNING_SUBJECT" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WINDOWS_SIGNING_SUBJECT is not set: Windows ships unsigned, without winget or in-app updates"
          fi

  # The release jobs build and package; formatting, lints and the test suites
  # are CI's, on every platform, for this same commit. Building overlaps CI so
  # the two macOS queues do not add up, but nothing is signed, attested or
  # published until this job has seen CI pass; a failed or cancelled CI run
  # stops the release here instead of being retested.
  ci-gate:
    needs: validate
    if: >-
      github.repository == 'penso/herdr-gpui' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Require CI to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
        run: python3 scripts/release/check-ci.py "$EXPECTED_SHA" --wait

  # Both macOS targets build on Apple Silicon: Intel runners are scarce and
  # slow, and x86_64 cross-compiles there and runs under Rosetta. Formatting,
  # lints and the test suites are CI's, which validate requires for this commit.
  macos-build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.2'
      TARGET: ${{ matrix.target }}
      HERDR_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      HERDR_UPDATE_PUBLIC_KEY: ${{ vars.HERDR_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - run: rustup show
      - run: rustup target add "$TARGET"
      - name: Require Rosetta for the x86_64 executable
        if: matrix.arch == 'x86_64'
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - run: cargo build --locked --release -p herdr-gpui -p herdr-acp -p herdr-remote-control -p herdr-automate --target "$TARGET"
      # Herdr 2 terminals run in the pinned herdr-core beside it, fetched
      # and checked against its checksum in herdr-core.json.
      - run: python3 scripts/release/fetch-herdr-core.py "$TARGET" "target/$TARGET/release"
      # Rosetta translates an x86_64 executable on its first launch, which can
      # outlast the smoke test's 10 second limit. Launch it once untimed, as
      # CI does, so the smoke test finds it translated.
      - name: Translate the x86_64 executable once
        if: matrix.arch == 'x86_64'
        run: '"target/$TARGET/release/herdr-gpui" --build-info'
      - run: python3 scripts/release/smoke-cli.py "target/$TARGET/release/herdr-gpui"
      # The app starts chats with the herdr-acp beside its executable.
      - run: '"target/$TARGET/release/herdr-acp" --help'
      # Remote control runs the herdr-remote-control beside it as a user service.
      - run: '"target/$TARGET/release/herdr-remote-control" --version'
      # Automations run in the herdr-automate beside it.
      - run: '"target/$TARGET/release/herdr-automate" --version'
      - run: '"target/$TARGET/release/herdr-core" --version'
      - name: Install the notice generator
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - run: cargo about --version
      - run: python3 scripts/release/generate-notices.py "target/$TARGET/release/THIRD-PARTY-NOTICES.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4, Arbor/Moltis
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/herdr-gpui
            target/${{ matrix.target }}/release/herdr-acp
            target/${{ matrix.target }}/release/herdr-remote-control
            target/${{ matrix.target }}/release/herdr-automate
            target/${{ matrix.target }}/release/herdr-core
            target/${{ matrix.target }}/release/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
      HERDR_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      HERDR_UPDATE_PUBLIC_KEY: ${{ vars.HERDR_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Install GPUI build dependencies
        run: bash scripts/install-linux-deps.sh
      - run: rustup show
      - name: Require the declared native target
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
      - run: cargo build --locked --release -p herdr-gpui -p herdr-acp -p herdr-remote-control -p herdr-automate --target "$TARGET"
      # Herdr 2 terminals run in the pinned herdr-core beside it, fetched
      # and checked against its checksum in herdr-core.json.
      - run: python3 scripts/release/fetch-herdr-core.py "$TARGET" "target/$TARGET/release"
      - run: python3 scripts/release/smoke-cli.py "target/$TARGET/release/herdr-gpui"
      # The app starts chats with the herdr-acp beside its executable.
      - run: '"target/$TARGET/release/herdr-acp" --help'
      # Remote control runs the herdr-remote-control beside it as a user service.
      - run: '"target/$TARGET/release/herdr-remote-control" --version'
      # Automations run in the herdr-automate beside it.
      - run: '"target/$TARGET/release/herdr-automate" --version'
      - run: '"target/$TARGET/release/herdr-core" --version'
      - name: Install the notice generator
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - run: cargo about --version
      - run: python3 scripts/release/generate-notices.py "target/$TARGET/release/THIRD-PARTY-NOTICES.txt"
      - name: Package Linux executable
        run: |
          mkdir dist
          bash scripts/release/package-linux.sh "$VERSION" "$TARGET" "target/$TARGET/release/herdr-gpui" dist "target/$TARGET/release/THIRD-PARTY-NOTICES.txt"
          python3 scripts/update-manifest.py package-linux "target/$TARGET/release/herdr-gpui" "$TARGET" "$VERSION" \
            "dist/herdr-gpui-$VERSION-$TARGET-update.tar.gz"
      # The .deb, .rpm and Arch packages repackage the manual archive's exact
      # files under /usr, so every Linux format ships the same binary.
      - name: Package distribution formats from the manual archive
        run: |
          nfpm=$(bash scripts/release/install-nfpm.sh "$RUNNER_TEMP/nfpm")
          python3 scripts/release/package-linux-distro.py "$VERSION" "$TARGET" \
            "dist/Herdr-$VERSION-$TARGET.tar.gz" dist --nfpm "$nfpm"
      - name: Install each package on its distribution and check its libraries
        run: bash scripts/release/smoke-linux-packages.sh "$VERSION" "$TARGET" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package-${{ matrix.target }}
          path: |
            dist/Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}.deb
            dist/Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}.rpm
            dist/Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}.pkg.tar.zst
            dist/herdr-gpui-${{ needs.validate.outputs.version }}-${{ matrix.target }}-update.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The executable is built and its CLI smoke-tested here, and windows-sign
  # Authenticode-signs exactly these bytes. Nothing runs its window or a live
  # daemon. Signed releases list the installers in windows-manifest.json, so
  # installed copies update in the app. No credentials reach this job or its
  # build scripts.
  windows:
    name: Windows (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
      HERDR_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      HERDR_UPDATE_PUBLIC_KEY: ${{ vars.HERDR_UPDATE_PUBLIC_KEY }}
      # The publisher the in-app updater requires on a downloaded installer
      # (herdr-updater/src/windows.rs); windows-sign checks the release is signed by it.
      # A repository variable: this job is outside the release environment.
      # Empty while signing is not set up, which turns that build's updater off.
      HERDR_WINDOWS_SIGNER: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - run: rustup show
      - name: Require the declared native target
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
      - run: cargo build --locked --release -p herdr-gpui -p herdr-gpui-launcher -p herdr-acp -p herdr-remote-control -p herdr-automate --target "$TARGET"
      # Herdr 2 terminals run in the pinned herdr-core beside it; ARM64 gets
      # the x64 build, which Windows on ARM runs.
      - run: python scripts/release/fetch-herdr-core.py "$TARGET" "target/$TARGET/release"
      - run: python scripts/release/smoke-cli.py "target/$TARGET/release/herdr-gpui.exe"
      - run: '"target/$TARGET/release/herdr-acp.exe" --help'
      - run: '"target/$TARGET/release/herdr-remote-control.exe" --version'
      - run: '"target/$TARGET/release/herdr-automate.exe" --version'
      - run: '"target/$TARGET/release/herdr-core.exe" --version'
      - name: Install the notice generator
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - run: cargo about --version
      # The Windows image provides `python`, not `python3`.
      - run: python scripts/release/generate-notices.py "target/$TARGET/release/THIRD-PARTY-NOTICES.txt"
      - name: Package Windows executable
        run: |
          mkdir dist
          python scripts/release/package-windows.py "$VERSION" "$TARGET" "target/$TARGET/release/herdr-gpui.exe" "target/$TARGET/release/herdr-gpui-launcher.exe" dist "target/$TARGET/release/THIRD-PARTY-NOTICES.txt"
      - name: Install the pinned Inno Setup compiler
        run: python scripts/release/windows-installer.py install-iscc "$RUNNER_TEMP/inno-setup" > "$RUNNER_TEMP/iscc-path"
      - name: Build the Windows installer
        run: python scripts/release/windows-installer.py build "$VERSION" "$TARGET" "dist/Herdr-$VERSION-$TARGET.zip" dist "$(cat "$RUNNER_TEMP/iscc-path")"
      - name: Install and uninstall the Windows installer
        run: python scripts/release/windows-installer.py smoke "dist/Herdr-$VERSION-$TARGET-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package-${{ matrix.target }}
          path: |
            dist/Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}.zip
            dist/Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}-setup.exe
          if-no-files-found: error
          retention-days: 7

  # Signs the tested build without running it: unpack the zip, sign both
  # executables (herdr-gpui.exe and its windowed launcher), check
  # nothing else changed, repack, then rebuild the installer with ISCC signing
  # its uninstaller and Setup.exe. Azure Artifact Signing trusts only this
  # repository's OIDC token for the protected release environment, so the
  # identity and account below are useless anywhere else.
  windows-sign:
    name: Windows signing (${{ matrix.target }})
    needs: [validate, windows, ci-gate]
    if: >-
      github.repository == 'penso/herdr-gpui' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso' &&
      needs.validate.outputs.windows_signed == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    # Signing and ISCC run the same on x64 for both targets.
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      # No token/run-id override: artifacts can only come from this workflow run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package-${{ matrix.target }}
          path: unsigned
      - name: Unpack the tested executables without running them
        run: python scripts/release/windows-signing.py unpack "unsigned/Herdr-$VERSION-$TARGET.zip" "$RUNNER_TEMP/signing"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Also installs the ArtifactSigning module that windows-sign-file.ps1
      # uses for the installer. No dependency cache in a signing job.
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ runner.temp }}\signing\Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}\herdr-gpui.exe
            ${{ runner.temp }}\signing\Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}\herdr-gpui-launcher.exe
            ${{ runner.temp }}\signing\Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}\herdr-acp.exe
            ${{ runner.temp }}\signing\Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}\herdr-remote-control.exe
            ${{ runner.temp }}\signing\Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}\herdr-automate.exe
            ${{ runner.temp }}\signing\Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}\herdr-core.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Herdr UI
          description-url: https://herdrui.dev
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
          cache-dependencies: false
      - name: Repack the signed executables, refusing any change but the signatures
        run: |
          mkdir dist
          python scripts/release/windows-signing.py repack "unsigned/Herdr-$VERSION-$TARGET.zip" "$RUNNER_TEMP/signing" dist
      - name: Install the pinned Inno Setup compiler
        run: python scripts/release/windows-installer.py install-iscc "$RUNNER_TEMP/inno-setup" > "$RUNNER_TEMP/iscc-path"
      - name: Build the signed Windows installer
        run: python scripts/release/windows-installer.py build --sign "$VERSION" "$TARGET" "dist/Herdr-$VERSION-$TARGET.zip" dist "$(cat "$RUNNER_TEMP/iscc-path")"
      - name: Require timestamped signatures from the release identity
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          test -n "$WINDOWS_SIGNING_SUBJECT"
          python scripts/release/windows-signing.py verify --subject "$WINDOWS_SIGNING_SUBJECT" \
            "dist/Herdr-$VERSION-$TARGET.zip" "dist/Herdr-$VERSION-$TARGET-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signed-${{ matrix.target }}
          path: |
            dist/Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}.zip
            dist/Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}-setup.exe
          if-no-files-found: error
          retention-days: 7

  # The signed installer is new bytes, so install it again on each
  # architecture, outside the signing environment, and check that Windows
  # accepts every signature, the uninstaller's included.
  windows-smoke:
    name: Windows signed installer (${{ matrix.target }})
    needs: [validate, windows-sign]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-signed-${{ matrix.target }}
          path: dist
      - name: Install and uninstall the signed Windows installer
        run: python scripts/release/windows-installer.py smoke --signed "dist/Herdr-$VERSION-$TARGET-setup.exe"

  changelog:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          # Release notes are derived from history, which a shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - run: cargo install git-cliff --locked --version 2.12.0
      # Betas that were never promoted fold into this release's notes, so a
      # stable release lists everything since the previous stable one.
      - name: Generate the changelog and release notes from git history
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNED: ${{ needs.validate.outputs.windows_signed }}
        run: |
          set -euo pipefail
          mkdir release-notes
          # A plain assignment, so `set -e` stops on a failed request instead
          # of silently dropping the betas and shortening the notes.
          prereleases=$(gh api --paginate repos/penso/herdr-gpui/releases \
            --jq '.[] | select(.prerelease and (.draft | not)) | .tag_name')
          betas=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then betas+=("$tag"); fi
          done <<< "$prereleases"
          bash scripts/release/generate-changelog.sh "$VERSION" release-notes ${betas[@]+"${betas[@]}"}
          cat release-notes/RELEASE_NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: |
            release-notes/CHANGELOG.md
            release-notes/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  metadata:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - name: Generate locked release-platform graph including build dependencies
        run: |
          mkdir dist
          chmod +x scripts/release/cargo-locked.sh
          python3 scripts/release/generate-sbom.py "dist/Herdr-$VERSION.cdx.json"
          git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: dist/Herdr-${{ needs.validate.outputs.version }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [validate, ci-gate, macos-build, linux, windows, windows-sign]
    # windows-sign is skipped while Windows signing is not set up, and a
    # skipped need skips this job unless its condition checks results itself.
    if: >-
      !cancelled() &&
      github.repository == 'penso/herdr-gpui' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso' &&
      needs.validate.result == 'success' && needs.ci-gate.result == 'success' &&
      needs.macos-build.result == 'success' && needs.linux.result == 'success' &&
      needs.windows.result == 'success' &&
      (needs.windows-sign.result == 'success' ||
       (needs.validate.outputs.windows_signed == 'false' && needs.windows-sign.result == 'skipped'))
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      # No token/run-id override: artifacts can only come from this workflow run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64
          path: binaries/arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-x86_64
          path: binaries/x86_64
      - name: Assemble without executing the downloaded binaries
        run: |
          mkdir dist
          chmod +x binaries/arm64/herdr-gpui binaries/x86_64/herdr-gpui binaries/arm64/herdr-acp binaries/x86_64/herdr-acp binaries/arm64/herdr-remote-control binaries/x86_64/herdr-remote-control binaries/arm64/herdr-automate binaries/x86_64/herdr-automate binaries/arm64/herdr-core binaries/x86_64/herdr-core
          cmp binaries/arm64/THIRD-PARTY-NOTICES.txt binaries/x86_64/THIRD-PARTY-NOTICES.txt
          bash scripts/release/package-macos.sh "$VERSION" binaries/arm64/herdr-gpui binaries/x86_64/herdr-gpui dist binaries/arm64/THIRD-PARTY-NOTICES.txt
      - name: Sign and notarize app and DMG (never launch the app)
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: bash scripts/release/sign-macos.sh "$VERSION" dist/Herdr.app dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-package-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-package-aarch64-unknown-linux-gnu
          path: dist
      # The Authenticode-signed installers, so the Windows manifest lists the
      # exact bytes users download and the in-app updater runs; the tested
      # unsigned ones while signing is not set up, which no build's updater
      # accepts (none names a publisher, and signed ones check it).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.windows_signed == 'true' && 'windows-signed' || 'windows-package' }}-x86_64-pc-windows-msvc
          path: windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.windows_signed == 'true' && 'windows-signed' || 'windows-package' }}-aarch64-pc-windows-msvc
          path: windows
      - name: Generate and verify signed update manifest
        env:
          HERDR_UPDATE_PUBLIC_KEY: ${{ vars.HERDR_UPDATE_PUBLIC_KEY }}
          HERDR_UPDATE_SIGNING_KEY: ${{ secrets.HERDR_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          set +x
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL" version | grep -q '^OpenSSL 3\.'
          umask 077
          KEY_DIR="$(mktemp -d "$RUNNER_TEMP/update-key.XXXXXX")"
          trap 'rm -rf "$KEY_DIR"' EXIT
          test -n "$HERDR_UPDATE_SIGNING_KEY"
          printf '%s' "$HERDR_UPDATE_SIGNING_KEY" > "$KEY_DIR/private.pem"
          unset HERDR_UPDATE_SIGNING_KEY
          python3 scripts/update-manifest.py check-key "$OPENSSL" "$KEY_DIR/private.pem"
          python3 scripts/update-manifest.py create dist "$VERSION" --require-all-targets
          "$OPENSSL" pkeyutl -sign -rawin -inkey "$KEY_DIR/private.pem" -passin pass: \
            -in dist/update-manifest.json -out dist/update-manifest.sig
          "$OPENSSL" pkey -in "$KEY_DIR/private.pem" -passin pass: -pubout -out "$KEY_DIR/public.pem"
          "$OPENSSL" pkeyutl -verify -rawin -pubin -inkey "$KEY_DIR/public.pem" \
            -in dist/update-manifest.json -sigfile dist/update-manifest.sig
          test "$(wc -c < dist/update-manifest.sig | tr -d ' ')" = 64
          # Keep schema 1 unchanged for installed clients; package updaters use
          # their own signed manifest with the six distribution assets.
          python3 scripts/update-manifest.py create dist "$VERSION" --packages
          "$OPENSSL" pkeyutl -sign -rawin -inkey "$KEY_DIR/private.pem" -passin pass: \
            -in dist/package-manifest.json -out dist/package-manifest.sig
          "$OPENSSL" pkeyutl -verify -rawin -pubin -inkey "$KEY_DIR/public.pem" \
            -in dist/package-manifest.json -sigfile dist/package-manifest.sig
          test "$(wc -c < dist/package-manifest.sig | tr -d ' ')" = 64
          # Windows installers get a third manifest (schema 3) for the same reason.
          python3 scripts/update-manifest.py create windows "$VERSION" --windows
          mv windows/windows-manifest.json dist/
          "$OPENSSL" pkeyutl -sign -rawin -inkey "$KEY_DIR/private.pem" -passin pass: \
            -in dist/windows-manifest.json -out dist/windows-manifest.sig
          "$OPENSSL" pkeyutl -verify -rawin -pubin -inkey "$KEY_DIR/public.pem" \
            -in dist/windows-manifest.json -sigfile dist/windows-manifest.sig
          test "$(wc -c < dist/windows-manifest.sig | tr -d ' ')" = 64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signed
          path: |
            dist/Herdr-${{ needs.validate.outputs.version }}-universal-apple-darwin.dmg
            dist/herdr-gpui-${{ needs.validate.outputs.version }}-macos-universal.app.tar.gz
            dist/update-manifest.json
            dist/update-manifest.sig
            dist/package-manifest.json
            dist/package-manifest.sig
            dist/windows-manifest.json
            dist/windows-manifest.sig
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: [validate, sign, linux, windows-sign, windows-smoke, metadata]
    # Like sign: the Windows signing jobs may be skipped, never failed.
    if: >-
      !cancelled() &&
      github.repository == 'penso/herdr-gpui' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso' &&
      needs.validate.result == 'success' && needs.sign.result == 'success' &&
      needs.linux.result == 'success' && needs.metadata.result == 'success' &&
      ((needs.windows-sign.result == 'success' && needs.windows-smoke.result == 'success') ||
       (needs.validate.outputs.windows_signed == 'false' && needs.windows-sign.result == 'skipped' &&
        needs.windows-smoke.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-signed
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-package-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-package-aarch64-unknown-linux-gnu
          path: dist
      # The Authenticode-signed builds, so checksums, Sigstore and provenance
      # cover the bytes users download; the tested unsigned builds while
      # signing is not set up.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.windows_signed == 'true' && 'windows-signed' || 'windows-package' }}-x86_64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.windows_signed == 'true' && 'windows-signed' || 'windows-package' }}-aarch64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: dist
      - run: python3 scripts/release/artifact-manifest.py base "$VERSION" dist
      # cosign v3 makes the new bundle format the default: it ignores
      # --output-signature/--output-certificate and writes a single .bundle
      # instead. The published asset set, artifact-manifest.py and
      # verify-release.sh are all defined in terms of the .sig/.crt sidecars, so
      # pin the last v2 rather than silently changing what a release publishes.
      # Migrating to bundles is a deliberate change to the verification contract.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'
      # Deliberately execute the action from the already SHA-validated checkout.
      - uses: ./.github/actions/sign-artifacts # zizmor: ignore[self-repository]
        with:
          working-directory: dist
          files: Herdr-${{ needs.validate.outputs.version }}-universal-apple-darwin.dmg Herdr-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz Herdr-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.deb Herdr-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.rpm Herdr-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.pkg.tar.zst Herdr-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz Herdr-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.deb Herdr-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.rpm Herdr-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.pkg.tar.zst Herdr-${{ needs.validate.outputs.version }}-x86_64-pc-windows-msvc.zip Herdr-${{ needs.validate.outputs.version }}-aarch64-pc-windows-msvc.zip Herdr-${{ needs.validate.outputs.version }}-x86_64-pc-windows-msvc-setup.exe Herdr-${{ needs.validate.outputs.version }}-aarch64-pc-windows-msvc-setup.exe Herdr-${{ needs.validate.outputs.version }}.cdx.json herdr-gpui-${{ needs.validate.outputs.version }}-macos-universal.app.tar.gz herdr-gpui-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu-update.tar.gz herdr-gpui-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu-update.tar.gz update-manifest.json update-manifest.sig package-manifest.json package-manifest.sig windows-manifest.json windows-manifest.sig
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Herdr-${{ needs.validate.outputs.version }}-universal-apple-darwin.dmg
            dist/Herdr-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            dist/Herdr-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.deb
            dist/Herdr-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.rpm
            dist/Herdr-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.pkg.tar.zst
            dist/Herdr-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz
            dist/Herdr-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.deb
            dist/Herdr-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.rpm
            dist/Herdr-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.pkg.tar.zst
            dist/Herdr-${{ needs.validate.outputs.version }}-x86_64-pc-windows-msvc.zip
            dist/Herdr-${{ needs.validate.outputs.version }}-aarch64-pc-windows-msvc.zip
            dist/Herdr-${{ needs.validate.outputs.version }}-x86_64-pc-windows-msvc-setup.exe
            dist/Herdr-${{ needs.validate.outputs.version }}-aarch64-pc-windows-msvc-setup.exe
            dist/Herdr-${{ needs.validate.outputs.version }}.cdx.json
            dist/herdr-gpui-${{ needs.validate.outputs.version }}-macos-universal.app.tar.gz
            dist/herdr-gpui-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu-update.tar.gz
            dist/herdr-gpui-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu-update.tar.gz
            dist/update-manifest.json
            dist/update-manifest.sig
            dist/package-manifest.json
            dist/package-manifest.sig
            dist/windows-manifest.json
            dist/windows-manifest.sig
      - run: python3 scripts/release/artifact-manifest.py create "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, attest, changelog]
    if: >-
      github.repository == 'penso/herdr-gpui' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      CHANNEL: ${{ needs.validate.outputs.channel }}
      GH_REPO: penso/herdr-gpui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      # Kept out of dist: the release body is not part of the signed asset set.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes
      - run: python3 scripts/release/artifact-manifest.py verify "$VERSION" dist
      - name: Refuse existing tag or release, then create immutable tag and draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.error, urllib.request
          tag = "v" + os.environ["VERSION"]
          for path in (f"git/ref/tags/{tag}", f"releases/tags/{tag}"):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/penso/herdr-gpui/{path}",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json"})
              try:
                  urllib.request.urlopen(request).close()
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              else:
                  raise SystemExit(f"Refusing existing {path}")
          PY
          gh api repos/penso/herdr-gpui/git/refs -X POST \
            -f "ref=refs/tags/v$VERSION" -f "sha=$RELEASE_SHA"
          # A beta is a GitHub prerelease: /releases/latest, and so the stable
          # updater channel and Homebrew, never see it until promote.yml flips it.
          channel=()
          title="Herdr UI $VERSION"
          if [[ "$CHANNEL" == beta ]]; then
            channel=(--prerelease --latest=false)
            title="$title (beta)"
          fi
          gh release create "v$VERSION" --verify-tag --target "$RELEASE_SHA" --draft \
            ${channel[@]+"${channel[@]}"} --title "$title" \
            --notes-file release-notes/RELEASE_NOTES.md \
            dist/*
      - name: Verify uploaded draft bytes and exact asset set before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=$(python3 scripts/release/artifact-manifest.py names "$VERSION" dist | jq -R . | jq -s .)
          gh release view "v$VERSION" --json isDraft,isPrerelease,assets | \
            jq -e --argjson expected "$expected" --arg channel "$CHANNEL" \
              '.isDraft and .isPrerelease == ($channel == "beta") and (([.assets[].name] | sort) == ($expected | sort))'
          gh release download "v$VERSION" --dir verified
          cmp dist/SHA256SUMS verified/SHA256SUMS
          python3 scripts/release/artifact-manifest.py verify "$VERSION" verified
          [[ "$(gh api "repos/penso/herdr-gpui/git/ref/tags/v$VERSION" --jq .object.sha)" == "$RELEASE_SHA" ]]
          gh release edit "v$VERSION" --draft=false

  # Betas stay out of the tap; promote.yml updates it when one is promoted.
  # Keep these steps identical to promote.yml's homebrew job.
  homebrew:
    needs: [validate, publish]
    if: >-
      github.repository == 'penso/herdr-gpui' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso' &&
      needs.validate.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: homebrew
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_REPO: penso/herdr-gpui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Download published final DMG and validate its published checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --json isDraft,isPrerelease | jq -e '.isDraft == false and .isPrerelease == false'
          [[ "$(gh api "repos/penso/herdr-gpui/git/ref/tags/v$VERSION" --jq .object.sha)" == "$RELEASE_SHA" ]]
          gh release download "v$VERSION" --dir final \
            --pattern "Herdr-$VERSION-universal-apple-darwin.dmg" --pattern SHA256SUMS
          checksum=$(python3 scripts/release/artifact-manifest.py dmg "$VERSION" final)
          bash scripts/release/render-cask.sh "$VERSION" "$checksum" > rendered-cask.rb
      - name: Commit only the tap cask using its dedicated deploy key
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: bash scripts/release/update-homebrew.sh "$VERSION" rendered-cask.rb

  # Keep these steps identical in release.yml and promote.yml. Betas never
  # reach winget: promote.yml submits one when it is promoted. Neither do
  # unsigned releases.
  winget:
    needs: [validate, publish]
    if: >-
      github.repository == 'penso/herdr-gpui' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso' &&
      needs.validate.outputs.windows_signed == 'true' &&
      needs.validate.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: winget
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_REPO: penso/herdr-gpui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Download the published checksums of the final installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --json isDraft,isPrerelease | jq -e '.isDraft == false and .isPrerelease == false'
          [[ "$(gh api "repos/penso/herdr-gpui/git/ref/tags/v$VERSION" --jq .object.sha)" == "$RELEASE_SHA" ]]
          gh release download "v$VERSION" --dir final --pattern SHA256SUMS
      - name: Install the pinned Komac
        run: python3 scripts/release/winget.py install-komac "$RUNNER_TEMP/komac" > "$RUNNER_TEMP/komac-path"
      - name: Check the generated manifests and open the winget-pkgs pull request
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: python3 scripts/release/winget.py submit "$VERSION" final/SHA256SUMS "$(cat "$RUNNER_TEMP/komac-path")" "$RUNNER_TEMP/winget"
