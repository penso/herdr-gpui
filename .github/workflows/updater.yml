name: Updater Packaging

# Only what scripts/test-updater.py compiles and the manifest tests read, in
# both lists: its macOS jobs share runners with CI and Release.
on:
  pull_request:
    paths:
      - 'crates/sheprd-updater/**'
      - 'crates/sheprd-client/**'
      - 'crates/sheprd-protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/test-updater.py'
      - 'scripts/update-manifest.py'
      - 'scripts/test_*manifest.py'
      - '.github/workflows/updater.yml'
  push:
    branches: [main]
    paths:
      - 'crates/sheprd-updater/**'
      - 'crates/sheprd-client/**'
      - 'crates/sheprd-protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/test-updater.py'
      - 'scripts/update-manifest.py'
      - 'scripts/test_*manifest.py'
      - '.github/workflows/updater.yml'
  workflow_dispatch:

permissions: {}

# Its macOS jobs share runners with CI and Release. Without this, every push
# left another run queued, and stale ones delayed release builds for hours.
concurrency:
  group: updater-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-harness:
    name: Rust Updater (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select repository Rust toolchain
        run: rustup show
      - name: Test real updater without GPUI or desktop dependencies
        run: python3 scripts/test-updater.py

  packaging:
    name: Python Contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test archive and authentication contract
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          else
            OPENSSL=/usr/bin/openssl
          fi
          export OPENSSL
          "$OPENSSL" version | grep -q '^OpenSSL 3\.'
          python3 -m unittest discover -s scripts -p 'test_*manifest.py' -v
