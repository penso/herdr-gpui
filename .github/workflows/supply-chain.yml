name: Supply chain

on:
  push:
    branches: [main]
    paths: ['**/Cargo.toml', 'Cargo.lock', 'deny.toml', '.github/workflows/supply-chain.yml']
  pull_request:
    paths: ['**/Cargo.toml', 'Cargo.lock', 'deny.toml', '.github/workflows/supply-chain.yml']
  # Advisories are filed against dependencies that are not changing, so this
  # has to run on a clock to be useful at all.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@135698455da5c3b3e55f73f4419e481ab68cdd95 # v0.4.1
        with:
          advanced-security: false
          online-audits: false

  cargo-deny:
    name: cargo-deny (${{ matrix.check }})
    needs: zizmor
    # Runs on Linux deliberately: cargo-deny reads the lockfile and never
    # builds, and deny.toml pins graph evaluation to the macOS targets.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Split so an advisory filed upstream does not mask a license or
        # source regression introduced by the change under review.
        check: [advisories, bans licenses sources]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.check }}
