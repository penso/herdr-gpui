name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; every job below declares the scopes it actually needs.
# Fork PRs rely on Settings > Actions > General > Require approval for all
# external contributors. Approval permits execution, not access to secrets:
# keep pull_request, hosted runners, and secret-free/read-only PR jobs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Audits the workflows themselves for injection, over-broad permissions,
  # unpinned actions, and credential persistence. Gates the application
  # jobs to catch workflow mistakes early; GitHub's fork isolation and protected
  # release environments remain the credential boundary, not the scanner.
  zizmor:
    if: >-
      github.repository == 'penso/herdr-gpui' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'penso' && github.triggering_actor == 'penso' &&
        github.ref == 'refs/heads/main'))
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          online-audits: false

  # The release changelog is generated from these subjects, so a bad one is a
  # release defect. Local commits are caught earlier by `just hooks`.
  commits:
    if: >-
      github.repository == 'penso/herdr-gpui' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'penso' && github.triggering_actor == 'penso' &&
        github.ref == 'refs/heads/main'))
    name: Commit messages
    needs: zizmor
    outputs:
      code: ${{ steps.changes.outputs.code }}
      windows_package: ${{ steps.changes.outputs.windows_package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range being checked is history the default shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit subject the changelog will publish
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A first push or a rewritten branch has no usable base; check the
          # tip alone rather than every commit that ever reached the repository.
          if [[ ! $BASE =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$HEAD_SHA~1"
          fi
          python3 scripts/release/check-commit-messages.py range "$BASE..$HEAD_SHA"
      - name: Detect build and test inputs
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  checks:
    if: >-
      needs.commits.outputs.code == 'true' &&
      github.repository == 'penso/herdr-gpui' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'penso' && github.triggering_actor == 'penso' &&
        github.ref == 'refs/heads/main'))
    name: Format, lint, and test (${{ matrix.runner }})
    needs: [zizmor, commits]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps.sh
      # Lets the release script tests build real .deb, .rpm and Arch packages.
      - name: Install the pinned Linux package builder
        if: runner.os == 'Linux'
        run: echo "HERDR_TEST_NFPM=$(bash scripts/release/install-nfpm.sh "$RUNNER_TEMP/nfpm")" >> "$GITHUB_ENV"
      - name: Test release scripts and security contracts without credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          jq --version
          python3 -m unittest discover -s scripts/release/tests -v
          python3 scripts/release/test-release-security.py
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check source file sizes
        run: bash scripts/check-file-size.sh
      - name: Check keep-sorted regions
        run: |
          python3 scripts/test_check_sorted.py
          python3 scripts/check-sorted.py
      - name: Test mockup feedback receiver
        run: python3 .claude/skills/gpui-mockup/scripts/test_wait.py
      - name: Lint every target and feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Lint without default features
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - name: Test default features and executable CLI
        run: cargo test --locked --workspace
      - name: Test integration-feature build and executable CLI
        run: cargo test --locked --workspace --all-features

  # Match the other platforms' Rust checks without an extra optimized build.
  # Native GUI tests run in windows-native; release builds and optimized CLI
  # tests run in the release workflow.
  windows:
    if: >-
      needs.commits.outputs.code == 'true' &&
      github.repository == 'penso/herdr-gpui' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'penso' && github.triggering_actor == 'penso' &&
        github.ref == 'refs/heads/main'))
    name: Windows check (${{ matrix.runner }})
    needs: [zizmor, commits]
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every target and feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Lint without default features
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - name: Test default features and executable CLI
        run: cargo test --locked --workspace
      - name: Test integration-feature build and executable CLI
        run: cargo test --locked --workspace --all-features

  # The native GUI tests (`just test-gui`, `just test-sidebar`) on a real
  # Windows desktop session against a pinned, checksummed Herdr daemon in the
  # shared test sandbox, then the release-mode performance budget
  # (`just test-perf`). Hosted runners have no GPU, so Direct3D runs on WARP:
  # the budget is a regression tripwire, not a target for real hardware.
  windows-native:
    if: >-
      needs.commits.outputs.code == 'true' &&
      github.repository == 'penso/herdr-gpui' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'penso' && github.triggering_actor == 'penso' &&
        github.ref == 'refs/heads/main'))
    name: Windows native GUI (${{ matrix.runner }})
    needs: [zizmor, commits]
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: native-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the pinned Herdr daemon
        run: echo "HERDR_TEST_BINARY=$(python scripts/install-herdr-windows.py "$RUNNER_TEMP/herdr")" >> "$GITHUB_ENV"
      # Runners start at 1024x768; the sidebar fixture skips, and counts, any
      # window size the display cannot hold if this is refused.
      - name: Raise the desktop resolution
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/set-display-resolution.ps1
      # Herdr publishes no ARM64 Windows build. Under x64 emulation on
      # windows-11-arm its panes echo typed text but never act on Enter, so
      # the live-daemon test runs on x64; the native fixtures run on both.
      - name: Native window, input, and live-daemon tests
        env:
          RUNNER: ${{ matrix.runner }}
        run: |
          skip=()
          if [[ $RUNNER == windows-11-arm ]]; then skip=(--skip native_gui_live); fi
          cargo test --locked -p herdr-gpui --features integration-test --test live_gui -- --ignored --nocapture --test-threads=1 "${skip[@]}"
      # The updater's Authenticode check against a real signature: the pinned
      # archive's Microsoft-signed OpenConsole.exe, compared with PowerShell.
      - name: Update installer signer check
        run: |
          HERDR_TEST_SIGNED_FILE="$(dirname "$HERDR_TEST_BINARY")/conpty/x64/OpenConsole.exe" \
            cargo test --locked -p herdr-gpui signer_matches_what_powershell_reports -- --ignored --nocapture
      - name: Release-mode performance budget
        env:
          HERDR_PERF_P95_MS: '100'
        run: |
          cargo build --locked --release -p herdr-gpui --features integration-test
          target/release/herdr-gpui.exe --performance-test

  # The optimized Windows build, its zip, and its installer, made and installed
  # as the release workflow does, so a packaging or installer mistake fails the
  # pull request rather than a release. A release build is too slow for every
  # change, so this runs only when what those artifacts are made from changes.
  windows-package:
    if: >-
      needs.commits.outputs.windows_package == 'true' &&
      github.repository == 'penso/herdr-gpui' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'penso' && github.triggering_actor == 'penso' &&
        github.ref == 'refs/heads/main'))
    name: Windows package and installer
    needs: [zizmor, commits]
    runs-on: windows-2025
    timeout-minutes: 60
    # The steps read "$TARGET" and friends, as the release workflow's do.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      # Packaging names files after a release version; any valid one will do.
      VERSION: '20000101.1'
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The other jobs that run scripts/release/tests are macOS and Linux,
      # where the shortcut test skips; run it here, before the slow build.
      - name: Test the install script's Start menu shortcut
        run: python scripts/release/tests/test_install_ps1.py -v
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-package
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build optimized Windows executables
        run: cargo build --locked --release -p herdr-gpui -p herdr-gpui-launcher --target "$TARGET"
      # The release job passes generated third-party notices; any nonempty
      # file exercises the same packaging.
      - name: Package the Windows zip
        run: |
          mkdir dist
          python scripts/release/package-windows.py "$VERSION" "$TARGET" "target/$TARGET/release/herdr-gpui.exe" "target/$TARGET/release/herdr-gpui-launcher.exe" dist LICENSE
      - name: Install the pinned Inno Setup compiler
        run: python scripts/release/windows-installer.py install-iscc "$RUNNER_TEMP/inno-setup" > "$RUNNER_TEMP/iscc-path"
      - name: Build the Windows installer
        run: python scripts/release/windows-installer.py build "$VERSION" "$TARGET" "dist/Herdr-$VERSION-$TARGET.zip" dist "$(cat "$RUNNER_TEMP/iscc-path")"
      - name: Install and uninstall the Windows installer
        run: python scripts/release/windows-installer.py smoke "dist/Herdr-$VERSION-$TARGET-setup.exe"

  # Keep the branch-protection context stable while requiring every platform.
  checks-passed:
    name: Format, lint, and test
    needs: [checks, windows, windows-native, windows-package, commits]
    if: >-
      always() &&
      github.repository == 'penso/herdr-gpui' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'penso' && github.triggering_actor == 'penso' &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all platform checks
        env:
          RESULT: ${{ needs.checks.result }}
          WINDOWS: ${{ needs.windows.result }}
          NATIVE: ${{ needs.windows-native.result }}
          PACKAGE: ${{ needs.windows-package.result }}
          COMMITS: ${{ needs.commits.result }}
          CODE: ${{ needs.commits.outputs.code }}
          PACKAGE_INPUTS: ${{ needs.commits.outputs.windows_package }}
        run: |
          test "$COMMITS" = success || exit 1
          if [ "$CODE" = true ]; then
            test "$RESULT" = success && test "$WINDOWS" = success && test "$NATIVE" = success || exit 1
          else
            test "$CODE" = false && test "$RESULT" = skipped && test "$WINDOWS" = skipped && test "$NATIVE" = skipped || exit 1
          fi
          if [ "$PACKAGE_INPUTS" = true ]; then
            test "$PACKAGE" = success
          else
            test "$PACKAGE_INPUTS" = false && test "$PACKAGE" = skipped
          fi

  build:
    if: >-
      needs.commits.outputs.code == 'true' &&
      github.repository == 'penso/herdr-gpui' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    name: Release (${{ matrix.runner }}, ${{ matrix.arch }})
    needs: [zizmor, commits]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps.sh
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build optimized native executable
        run: cargo build --locked --release -p herdr-gpui
      - name: Exercise release executable without opening a window
        run: cargo test --locked --release -p herdr-gpui --test cli
