# XcodeGen spec for Sheprd, the native iOS app for Sheprd's remote
# control (docs/ios-app-plan.md). Generate the project with `xcodegen` in
# this directory; the .xcodeproj, Info.plists, and entitlements it writes
# are not committed. See README.md.
# Deployed bundle IDs, App Groups, Bonjour and URL schemes are compatibility
# identities. Changing the display brand must not break updates or pairing.
name: SheprdRemote

options:
  bundleIdPrefix: so.pen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    # Set your own team here or in Xcode (Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  SheprdRemoteCore:
    path: SheprdRemoteCore

targets:
  SheprdRemote:
    type: application
    platform: iOS
    sources:
      - SheprdRemote
      - Shared
    dependencies:
      - package: SheprdRemoteCore
      - target: SheprdRemoteWidgets
      - target: SheprdRemoteNotifications
      - target: SheprdRemoteShare
      - target: SheprdRemoteWatch
    info:
      path: SheprdRemote/Info.plist
      properties:
        CFBundleName: Sheprd
        # From the build settings, which the TestFlight upload sets.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Sheprd
        # Only standard algorithms (TLS, AES-GCM, ECDH, the system's
        # signatures), which is exempt: builds skip the export compliance
        # question in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: so.pen.herdr.remote
            CFBundleURLSchemes: [herdr-remote]
        # ATS checks a non-local IP address, such as Tailscale's 100.x, against
        # the system roots even after PinnedTrust accepts it, and fails it
        # (-1200, TLS -9802). NSAllowsLocalNetworking does not cover those
        # addresses, and its presence makes iOS ignore this key, so do not add
        # it. PinnedTrust still requires the computer's own CA for every load,
        # and the app only loads https origins.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: Sheprd reads the pairing QR code Sheprd shows on your computer, and takes photos you send to a chat.
        NSFaceIDUsageDescription: Sheprd asks for Face ID before a chat allows every tool call without asking.
        NSMicrophoneUsageDescription: Sheprd listens while you dictate a prompt or talk to it, transcribing it on your phone.
        NSSpeechRecognitionUsageDescription: Sheprd transcribes your dictated prompts and spoken commands on your phone.
        NSLocalNetworkUsageDescription: Sheprd talks to Sheprd on your computers over your local network.
        NSBonjourServices: [_herdr-remote._tcp]
        NSBluetoothAlwaysUsageDescription: Sheprd finds your computers nearby over Bluetooth when you pair one, and, when you turn it on, tells them you are near so they hold alerts while you are at the desk.
        # Presence reconnects to computers in the background, and an answer
        # given elsewhere clears notifications through a background push.
        UIBackgroundModes: [bluetooth-central, remote-notification]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        # A chat or terminal can open in a window of its own on iPad.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: SheprdRemote/SheprdRemote.entitlements
      properties:
        # Live Activity push tokens need the push capability. Use
        # `production` for TestFlight and App Store builds.
        aps-environment: development
        # The cache lives in the App Group, which the widgets will read.
        com.apple.security.application-groups: [group.so.pen.herdr.remote]
        # Questions interrupt Focus, as a waiting agent should.
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.pen.herdr.remote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SheprdRemoteWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - SheprdRemoteWatch
      - path: Shared/WidgetSummary.swift
      - path: Shared/WatchMessages.swift
    dependencies:
      - package: SheprdRemoteCore
    info:
      path: SheprdRemoteWatch/Info.plist
      properties:
        CFBundleName: Sheprd
        # From the build settings, which the TestFlight upload sets.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Sheprd
        CFBundleIconName: AppIcon
        WKApplication: true
        WKCompanionAppBundleIdentifier: so.pen.herdr.remote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.pen.herdr.remote.watchkitapp
        # App Store Connect refuses the upload without the Watch app's icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SheprdRemoteShare:
    type: app-extension
    platform: iOS
    sources:
      - SheprdRemoteShare
      - path: Shared/WidgetSummary.swift
      - path: SheprdRemote/BackgroundCommands.swift
      - path: SheprdRemote/DeviceKey.swift
      - path: SheprdRemote/Keychain.swift
      - path: SheprdRemote/PreparedImage.swift
      - path: SheprdRemote/RemoteClient.swift
    dependencies:
      - package: SheprdRemoteCore
    info:
      path: SheprdRemoteShare/Info.plist
      properties:
        CFBundleName: Sheprd
        # From the build settings, which the TestFlight upload sets.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Sheprd
        # Sharing goes through the same pinned RemoteClient as the app, so it
        # needs the app's ATS setting (see the SheprdRemote target).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
    entitlements:
      path: SheprdRemoteShare/SheprdRemoteShare.entitlements
      properties:
        # The paired computers' keychain item and the summary live here.
        com.apple.security.application-groups: [group.so.pen.herdr.remote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.pen.herdr.remote.share

  SheprdRemoteNotifications:
    type: app-extension
    platform: iOS
    sources:
      - SheprdRemoteNotifications
      - path: Shared/NotifyKey.swift
      - path: Shared/NotificationCategories.swift
    dependencies:
      - package: SheprdRemoteCore
    info:
      path: SheprdRemoteNotifications/Info.plist
      properties:
        CFBundleName: Sheprd
        # From the build settings, which the TestFlight upload sets.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Sheprd
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: SheprdRemoteNotifications/SheprdRemoteNotifications.entitlements
      properties:
        # The App Group is also the keychain group the alert key is in.
        com.apple.security.application-groups: [group.so.pen.herdr.remote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.pen.herdr.remote.notifications

  SheprdRemoteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SheprdRemoteWidgets
      - Shared
    dependencies:
      - package: SheprdRemoteCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: SheprdRemoteWidgets/Info.plist
      properties:
        CFBundleName: Sheprd
        # From the build settings, which the TestFlight upload sets.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Sheprd
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SheprdRemoteWidgets/SheprdRemoteWidgets.entitlements
      properties:
        # The summary the widgets and Controls draw lives here.
        com.apple.security.application-groups: [group.so.pen.herdr.remote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.pen.herdr.remote.widgets
        # The answer intent's perform runs in the app; the widget only
        # draws its button.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION

schemes:
  SheprdRemote:
    build:
      targets:
        SheprdRemote: all
    run:
      config: Debug
    archive:
      config: Release
