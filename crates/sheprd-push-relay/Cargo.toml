[package]
description            = "Forwards sealed pushes to APNs for the iOS app, knowing as little as it can"
edition.workspace      = true
license.workspace      = true
name                   = "sheprd-push-relay"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
postgres = ["dep:rustls", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:webpki-roots"]

[dependencies]
axum.workspace               = true
base64.workspace             = true
hmac.workspace               = true
p256.workspace               = true
rusqlite.workspace           = true
secrecy.workspace            = true
serde.workspace              = true
serde_json.workspace         = true
sha2.workspace               = true
sheprd-apns.workspace        = true
thiserror.workspace          = true
tokio.workspace              = true
tracing.workspace            = true
tracing-subscriber           = { features = ["fmt"], workspace = true }
rustls                       = { optional = true, workspace = true }
tokio-postgres               = { optional = true, workspace = true }
tokio-postgres-rustls        = { optional = true, workspace = true }
webpki-roots                 = { optional = true, workspace = true }

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace       = true
tower.workspace          = true
