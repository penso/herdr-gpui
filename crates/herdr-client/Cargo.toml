[package]
edition.workspace      = true
license.workspace      = true
name                   = "herdr-client"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# `ConnectTarget::Cloud`: machines a cloud provider created, reached through an
# application-built command. Each provider adds its `CloudProvider` variant.
cloud = []
boat = ["cloud"]
coder = ["cloud"]
daytona = ["cloud"]
railway = ["cloud"]

[dependencies]
crossbeam-channel.workspace = true
herdr-protocol.workspace    = true
serde.workspace             = true
serde_json.workspace        = true
sha2.workspace              = true
thiserror.workspace         = true
tracing.workspace           = true

# The PowerShell file-transfer tests encode scripts and use temporary folders
# on every platform, Windows included.
[dev-dependencies]
base64.workspace   = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
base64.workspace   = true
rustix.workspace   = true
tempfile.workspace = true

# The Windows daemon binds a named pipe, not an AF_UNIX socket; `interprocess`
# maps a socket path into the NPFS namespace exactly as upstream Herdr does.
# `windows-sys` supplies only `PeekNamedPipe`, which has no safe wrapper and
# which the session loop's bounded polling cannot do without.
[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
windows-sys.workspace  = true
