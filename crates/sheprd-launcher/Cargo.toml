# The windowed Windows launcher; Explorer and the Start menu open it so
# starting the console-subsystem `sheprd.exe` shows no console window.
[package]
edition.workspace      = true
license.workspace      = true
name                   = "sheprd-launcher"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

# `MessageBoxW`, the only way a windowed program without a console can report
# that it could not start the GUI.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true
