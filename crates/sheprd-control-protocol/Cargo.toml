[package]
edition.workspace      = true
license.workspace      = true
name                   = "sheprd-control-protocol"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
sheprd-client.workspace = true
sheprd-github.workspace = true
# The remote control daemon's status and device types, never its server.
sheprd-remote-control.workspace = true
serde.workspace        = true
serde_json.workspace   = true
# Only for `test-support`: its socket addresses live in private temporary directories.
tempfile               = { optional = true, workspace = true }
thiserror.workspace    = true
tracing.workspace      = true

# The pipe is created with a DACL; `sheprd_client::private_endpoint` reads the
# user and the pipe owner it is checked against.
[target.'cfg(windows)'.dependencies]
interprocess.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Fresh socket addresses for the app's control server tests.
test-support = ["dep:tempfile"]
