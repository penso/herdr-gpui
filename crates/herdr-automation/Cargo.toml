# Automation scripts: the Luau sandbox, the step catalog, schedules, caps, and
# the plan a person reviews before approving a script. No GPUI, no runtime.
[package]
edition.workspace      = true
license.workspace      = true
name                   = "herdr-automation"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
default = ["engine"]
# The Luau sandbox, plans and schedules. Clients that only read the daemon's
# reports (Herdr UI) turn it off and build no Luau.
engine = ["dep:herdr-luau", "dep:jiff", "dep:mlua", "dep:sha2", "dep:unicode-properties"]

[dependencies]
herdr-luau = { optional = true, workspace = true }
jiff      = { optional = true, workspace = true }
mlua      = { optional = true, workspace = true }
serde.workspace     = true
sha2      = { optional = true, workspace = true }
thiserror.workspace = true
# Refuses invisible formatting characters by Unicode category.
unicode-properties = { features = ["general-category"], optional = true, workspace = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace   = true
