[package]
edition.workspace      = true
license.workspace      = true
name                   = "sheprd-client"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# `ConnectTarget::Cloud`: machines a cloud provider created, reached through an
# application-built command. Each provider adds its `CloudProvider` variant.
cloud = []
azure = ["cloud"]
boat = ["cloud"]
coder = ["cloud"]
container = ["cloud"]
daytona = ["cloud"]
opensandbox = ["cloud"]
railway = ["cloud"]
sprites = ["cloud"]
# `login_env::probe_for_tests`, for the app's tests that start from a bare
# desktop environment.
test-support = []

[dependencies]
base64.workspace            = true
crossbeam-channel.workspace = true
sheprd-protocol.workspace    = true
serde.workspace             = true
serde_json.workspace        = true
tempfile.workspace          = true
thiserror.workspace         = true
tracing.workspace           = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# The Windows daemon binds a named pipe, not an AF_UNIX socket; `interprocess`
# maps a socket path into the NPFS namespace exactly as upstream Herdr does.
# `windows-sys` supplies the overlapped pipe calls behind the transport's read
# and write deadlines, which no safe wrapper offers without a runtime, and reads
# the user and pipe owner `private_endpoint` checks.
[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
windows-sys = { features = [
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
], workspace = true }

# `login_env`'s tests bind a socket that never listens.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
nix.workspace = true
