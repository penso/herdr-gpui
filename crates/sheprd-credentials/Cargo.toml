[package]
edition.workspace      = true
license.workspace      = true
name                   = "sheprd-credentials"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
secrecy.workspace   = true
thiserror.workspace = true
tracing.workspace   = true
zeroize.workspace   = true

# The private file: `openat` and friends keep every access relative to a
# directory that was checked, with POSIX ownership and mode bits.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

# The Secret Service client GPUI's Linux platform links, with its async-io
# backend, so this adds no runtime.
[target.'cfg(target_os = "linux")'.dependencies]
futures-lite.workspace = true
oo7.workspace          = true

# Credential Manager's `Cred*` functions, which no maintained safe wrapper
# offers without a second `windows-sys`.
[target.'cfg(windows)'.dependencies]
windows-sys = { features = ["Win32_Foundation", "Win32_Security_Credentials"], workspace = true }

[dev-dependencies]
tempfile.workspace = true
