[package]
description            = "Serves Herdr chats to paired phones over HTTPS, with push notifications"
edition.workspace      = true
license.workspace      = true
name                   = "sheprd-remote-control"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# The daemon itself. Sheprd depends on this crate without it, for the
# control protocol and `app` alone, so Tokio never reaches the GUI.
default = ["server"]
server = [
    "dep:aes-gcm",
    "dep:axum",
    "dep:futures-lite",
    "dep:base64",
    "dep:getrandom",
    "dep:gix",
    "dep:hkdf",
    "dep:if-addrs",
    "dep:maud",
    "dep:mdns-sd",
    "dep:sheprd-session",
    "dep:p256",
    "dep:pulldown-cmark",
    "dep:rcgen",
    "dep:rustls",
    "dep:secrecy",
    "dep:sheprd-apns",
    "dep:sha2",
    "dep:sheprd-terminal",
    "dep:socket2",
    "dep:sysinfo",
    "dep:time",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tracing-subscriber",
    "dep:ureq",
    "dep:x509-parser",
]

[[bin]]
name              = "sheprd-remote-control"
path              = "src/main.rs"
required-features = ["server"]

[dependencies]
secrecy                        = { optional = true, workspace = true }
sheprd-apns                    = { optional = true, workspace = true }
sheprd-chat-protocol.workspace = true
sheprd-client.workspace        = true
sheprd-github.workspace        = true
# The pairing dialog's QR code, drawn by Sheprd.
qrcode.workspace              = true
# The macOS user ID the LaunchAgent loads under, and the server's host name.
rustix                        = { features = ["system"], workspace = true }
serde.workspace               = true
serde_json.workspace          = true
# `enroll` replaces a host's Sheprd settings whole, as Sheprd does.
tempfile.workspace            = true
thiserror.workspace           = true
# A host's own `[remote]` table, read by `enroll`.
toml.workspace                = true
# Settings edits to the `[remote]` table.
toml_edit.workspace           = true
tracing.workspace             = true
url.workspace                 = true
uuid.workspace                = true

aes-gcm        = { optional = true, workspace = true }
axum           = { optional = true, workspace = true }
base64         = { optional = true, workspace = true }
futures-lite   = { optional = true, workspace = true }
getrandom      = { optional = true, workspace = true }
gix            = { optional = true, workspace = true }
hkdf           = { optional = true, workspace = true }
if-addrs       = { optional = true, workspace = true }
maud           = { optional = true, workspace = true }
# Advertises the daemon over Bonjour so phones nearby find it to pair.
mdns-sd        = { optional = true, workspace = true }
p256           = { optional = true, workspace = true }
pulldown-cmark = { optional = true, workspace = true }
rcgen          = { optional = true, workspace = true }
rustls         = { optional = true, workspace = true }
sha2           = { optional = true, workspace = true }
sheprd-core-client.workspace = true
sheprd-session = { optional = true, workspace = true }
sheprd-terminal = { optional = true, workspace = true }
socket2        = { optional = true, workspace = true }
# This computer's CPU and memory, shown above its workspaces on a phone.
sysinfo        = { optional = true, workspace = true }
time           = { optional = true, workspace = true }
tokio          = { optional = true, workspace = true }
tokio-rustls   = { optional = true, workspace = true }
# The daemon log: requests, refused handshakes, and errors phones report.
tracing-subscriber = { features = ["fmt"], optional = true, workspace = true }
ureq           = { optional = true, workspace = true }
x509-parser    = { optional = true, workspace = true }

# The host name for the CA's name and `HOSTNAME.local`.
[target.'cfg(unix)'.dependencies]

[dev-dependencies]
futures-util.workspace      = true
p256.workspace              = true
roxmltree.workspace         = true
tokio-tungstenite.workspace = true
tower.workspace             = true
