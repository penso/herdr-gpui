[package]
edition.workspace      = true
license.workspace      = true
name                   = "herdr-gpui"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
url.workspace = true
anyhow.workspace               = true
chrono.workspace               = true
config_loader.workspace        = true
ed25519-dalek.workspace        = true
flate2.workspace               = true
gpui-kit.workspace              = true
herdr-client.workspace         = true
image                          = { features = ["bmp", "tiff"], workspace = true }
rodio.workspace                = true
secrecy.workspace              = true
serde.workspace                = true
serde_json.workspace           = true
sha2.workspace                 = true
tar.workspace                  = true
tempfile.workspace             = true
thiserror.workspace            = true
toml.workspace                 = true
toml_edit.workspace            = true
tracing.workspace              = true
tracing-subscriber.workspace   = true
unicode-segmentation.workspace = true
unicode-width.workspace        = true
ureq.workspace                 = true
uuid.workspace                 = true
zeroize.workspace              = true

[dev-dependencies]
gpui-kit = { features = ["test-support"], workspace = true }

[features]
qa-menu = []
integration-test = [
  "objc2-app-kit/NSPasteboardItem",
  "dep:cocoa",
  "dep:core-graphics",
  "dep:foreign-types",
  "dep:objc",
  "dep:raw-window-handle",
]

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cocoa                        = { optional = true, workspace = true }
core-graphics                = { optional = true, workspace = true }
foreign-types                = { optional = true, workspace = true }
nix.workspace                = true
objc                         = { optional = true, workspace = true }
objc2.workspace              = true
objc2-app-kit.workspace      = true
objc2-foundation.workspace   = true
raw-window-handle            = { optional = true, workspace = true }
security-framework.workspace = true

[[test]]
name              = "live_gui"
required-features = ["integration-test"]

[[test]]
name              = "performance_gui"
required-features = ["integration-test"]
