[package]
edition.workspace      = true
license.workspace      = true
name                   = "herdr-gpui"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
url.workspace = true
aes.workspace                  = true
anyhow.workspace               = true
cbc.workspace                  = true
chrono.workspace               = true
config_loader.workspace        = true
ed25519-dalek.workspace        = true
flate2.workspace               = true
gpui.workspace                 = true
# Unlike gpui 0.2.2, the platform crate enables nothing by default: without
# font-kit (macOS) or a Linux backend, text silently goes to a no-op system.
gpui_platform                  = { features = ["font-kit", "runtime_shaders", "wayland", "x11"], workspace = true }
herdr-client.workspace         = true
image                          = { features = ["bmp", "tiff"], workspace = true }
pbkdf2.workspace               = true
rodio.workspace                = true
rusqlite.workspace             = true
secrecy.workspace              = true
serde.workspace                = true
serde_json.workspace           = true
sha1.workspace                 = true
sha2.workspace                 = true
tar.workspace                  = true
tempfile.workspace             = true
thiserror.workspace            = true
toml.workspace                 = true
toml_edit.workspace            = true
tracing.workspace              = true
tracing-subscriber.workspace   = true
unicode-segmentation.workspace = true
unicode-width.workspace        = true
ureq.workspace                 = true
uuid.workspace                 = true
zeroize.workspace              = true

[dev-dependencies]
gpui = { features = ["test-support"], workspace = true }

[features]
qa-menu = []
integration-test = [
  "objc2-app-kit/NSPasteboardItem",
  "dep:cocoa",
  "dep:core-graphics",
  "dep:foreign-types",
  "dep:objc",
]

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cocoa                        = { optional = true, workspace = true }
core-graphics                = { optional = true, workspace = true }
foreign-types                = { optional = true, workspace = true }
libloading.workspace         = true
nix.workspace                = true
objc                         = { optional = true, workspace = true }
objc2.workspace              = true
objc2-app-kit                = { features = ["NSGraphics", "NSView", "NSWindow"], workspace = true }
objc2-foundation.workspace   = true
raw-window-handle.workspace  = true
security-framework.workspace = true

[[test]]
name              = "live_gui"
required-features = ["integration-test"]

[[test]]
name              = "performance_gui"
required-features = ["integration-test"]
