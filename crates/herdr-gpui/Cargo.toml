[package]
edition.workspace      = true
license.workspace      = true
name                   = "herdr-gpui"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
url.workspace = true
ammonia.workspace              = true
anyhow.workspace               = true
base64.workspace               = true
chrono.workspace               = true
config_loader.workspace        = true
flate2.workspace               = true
getrandom.workspace            = true
gpui.workspace                 = true
# Unlike gpui 0.2.2, the platform crate enables nothing by default: without
# font-kit (macOS) or a Linux backend, text silently goes to a no-op system.
gpui_platform                  = { features = ["font-kit", "runtime_shaders", "wayland", "x11"], workspace = true }
gix.workspace                  = true
# Only the reports `herdr-automate --json` prints: the workspace entry turns
# default features off, so no Luau is built here.
herdr-automation.workspace     = true
herdr-chat-protocol.workspace  = true
herdr-client.workspace         = true
herdr-commands.workspace       = true
herdr-control-protocol.workspace = true
herdr-credentials.workspace    = true
herdr-diagnostics.workspace    = true
herdr-github.workspace         = true
herdr-orchestrator.workspace   = true
herdr-remote.workspace         = true
# Remote control without its server: the control protocol and `app`.
herdr-remote-control.workspace         = true
herdr-updater.workspace        = true
herdr-usage.workspace          = true
herdr-vcs.workspace            = true
if-addrs.workspace             = true
image                          = { features = ["bmp", "tiff"], workspace = true }
keepawake.workspace            = true
mdns-sd.workspace              = true
mermaid-rs-renderer.workspace  = true
nucleo-matcher.workspace       = true
percent-encoding.workspace     = true
pulldown-cmark.workspace       = true
rodio.workspace                = true
secrecy.workspace              = true
serde.workspace                = true
serde_ignored.workspace        = true
serde_json.workspace           = true
sha2.workspace                 = true
skrifa.workspace               = true
sysinfo.workspace              = true
syntect.workspace              = true
tempfile.workspace             = true
thiserror.workspace            = true
toml.workspace                 = true
toml_edit.workspace            = true
tracing.workspace              = true
tracing-subscriber.workspace   = true
unicode-properties.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace        = true
ureq.workspace                 = true
uuid.workspace                 = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
gpui = { features = ["test-support"], workspace = true }
herdr-client = { features = ["test-support"], workspace = true }
herdr-commands = { features = ["test-support"], workspace = true }
herdr-remote = { features = ["test-support"], workspace = true }
herdr-control-protocol = { features = ["test-support"], workspace = true }
herdr-diagnostics = { features = ["test-support"], workspace = true }
herdr-github = { features = ["test-support"], workspace = true }
herdr-orchestrator = { features = ["test-support"], workspace = true }
herdr-usage = { features = ["test-support"], workspace = true }
herdr-vcs = { features = ["test-support"], workspace = true }
socket2.workspace = true
test-case.workspace = true

[features]
default = ["azure", "boat", "coder", "container", "daytona", "opensandbox", "railway", "sprites"]
# Machines from cloud providers as devices: the shared device list, background
# jobs, and connector. Turned on by each provider below; not useful alone.
cloud = ["herdr-client/cloud", "herdr-remote/cloud", "herdr-usage/cloud", "herdr-vcs/cloud"]
# Azure VMs and Container Apps sandboxes as devices, with generic credentials
# or local Azure CLI. Sandboxes are reached over the data plane's exec stream.
azure = ["cloud", "herdr-client/azure", "herdr-remote/azure", "herdr-usage/azure", "herdr-vcs/azure"]
# Boat sandboxes as devices, with an API key and per-machine SSH key setup.
boat = ["cloud", "herdr-client/boat", "herdr-remote/boat"]
# Coder workspaces as devices, with OAuth2 sign-in.
coder = ["cloud", "herdr-client/coder", "herdr-remote/coder"]
# Containers on this computer's Docker or Podman engine as devices.
container = ["cloud", "herdr-client/container", "herdr-remote/container"]
# Daytona sandboxes as devices, with an API key and its SSH gateway.
daytona = ["cloud", "herdr-client/daytona", "herdr-remote/daytona"]
# Railway free VMs as devices, reached over SSH with a saved key identity.
# Sandboxes on a self-hosted OpenSandbox server as devices, through this app as their exec relay.
opensandbox = ["cloud", "herdr-client/opensandbox", "herdr-remote/opensandbox"]
railway = ["cloud", "herdr-client/railway", "herdr-remote/railway"]
# Fly Sprites as devices, with an API token and this app as their exec relay.
sprites = ["cloud", "herdr-client/sprites", "herdr-remote/sprites"]
qa-menu = []
# Development only: `--mockup` shows UI variants from HERDR_MOCKUP_FILE side by
# side in a native window. Never enabled in release builds. GPUI's test support
# provides `Window::render_to_image`, so `--capture` needs no screen-recording
# permission.
mockup = ["gpui_platform/test-support"]
integration-test = [
  "herdr-github/test-support",
  "objc2-app-kit/NSPasteboardItem",
  "dep:cocoa",
  "dep:core-graphics",
  "dep:foreign-types",
  "dep:objc",
  "dep:raw-window-handle",
]

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# wry has no working GPUI child-view backend on Linux yet; browser tabs there
# open in the system browser instead.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
wry.workspace = true

# `windows-sys` sets the window attributes and reads the
# system settings GPUI leaves to the app, and opens avatar cache entries without following reparse points. It also
# registers with Restart Manager (`restart_manager`), and sends the
# performance fixture its window messages.
# `clipboard-win` reads the clipboard on a background thread (see
# `window/clipboard`). `windows` has the shell's COM and WinRT interfaces (the
# taskbar, the jump list, and toasts); `windows-registry` reads the link
# handler and the startup entry, failing with `windows-result` errors.
[target.'cfg(windows)'.dependencies]
clipboard-win.workspace     = true
raw-window-handle.workspace = true
windows = { features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
], workspace = true }
windows-registry.workspace = true
windows-result.workspace   = true
windows-sys = { features = [
  "Wdk_System_SystemServices",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Recovery",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
], workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fontdb.workspace       = true
futures-lite.workspace = true
nix.workspace          = true
oo7.workspace          = true

[target.'cfg(target_os = "macos")'.dependencies]
font-kit.workspace              = true
block2.workspace                = true
dispatch2.workspace             = true
objc2-core-foundation.workspace = true
objc2-web-kit.workspace         = true
objc2-user-notifications.workspace = true
cocoa                        = { optional = true, workspace = true }
core-graphics                = { optional = true, workspace = true }
foreign-types                = { optional = true, workspace = true }
nix.workspace                = true
objc                         = { optional = true, workspace = true }
objc2.workspace              = true
objc2-app-kit.workspace      = true
objc2-foundation.workspace   = true
raw-window-handle            = { optional = true, workspace = true }

[[test]]
name              = "live_gui"
required-features = ["integration-test"]

[[test]]
name              = "performance_gui"
required-features = ["integration-test"]
